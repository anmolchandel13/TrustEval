spring.application.name=TrustEval
server.port=8080

# ==========================================
# H2 IN-MEMORY DATABASE (DEFAULT ZERO-SETUP)
# ==========================================
spring.datasource.url=jdbc:h2:mem:trustevaldb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================
# MYSQL CONFIGURATION (UNCOMMENT FOR MYSQL)
# ==========================================
# spring.datasource.url=jdbc:mysql://localhost:3306/trusteval_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=your_password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================
# SWAGGER / OPENAPI CONFIGURATION
# ==========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
